services:
  db:
    image: mysql:8.4
    container_name: eztrade-db
    environment:
      MYSQL_DATABASE: EZTrade
      MYSQL_USER: ${DB_USERNAME:-eztrade_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - eztrade_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./backend
    container_name: eztrade-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8088
      DB_URL: jdbc:mysql://db:3306/EZTrade?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: ${DB_USERNAME:-eztrade_user}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY:-replace-with-alpha-vantage-key}
      ALPHA_VANTAGE_MIN_INTERVAL_MS: ${ALPHA_VANTAGE_MIN_INTERVAL_MS:-1100}
      MARKET_CACHE_TTL_SECONDS: ${MARKET_CACHE_TTL_SECONDS:-30}
      JWT_SECRET: ${JWT_SECRET:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      JWT_TOKEN_EXPIRATION_MS: ${JWT_TOKEN_EXPIRATION_MS:-86400000}
      JWT_REFRESH_WINDOW_MS: ${JWT_REFRESH_WINDOW_MS:-604800000}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "${BACKEND_PORT:-8088}:8088"
    volumes:
      - ./backend:/workspace
      - eztrade_maven_cache:/root/.m2
    command: sh -c "chmod +x ./mvnw && ./mvnw spring-boot:run"

  frontend:
    build:
      context: ./frontend
    container_name: eztrade-frontend
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8088}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8088/ws}
      WATCHPACK_POLLING: ${WATCHPACK_POLLING:-true}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - eztrade_frontend_node_modules:/app/node_modules
      - eztrade_frontend_next:/app/.next
    command: npm run dev -- --hostname 0.0.0.0

volumes:
  eztrade_mysql_data:
  eztrade_maven_cache:
  eztrade_frontend_node_modules:
  eztrade_frontend_next:
