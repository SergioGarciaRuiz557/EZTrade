<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" fill="none" role="img" aria-labelledby="title description">
  <title id="title">EZTrade</title>
  <desc id="description">Explore markets. Follow every trade. A charcoal and gold banner with an abstract market line connecting discovery, trading, and portfolio tracking.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1280" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111317"/>
      <stop offset="1" stop-color="#1D1B14"/>
    </linearGradient>
    <radialGradient id="light" cx="0" cy="0" r="1" gradientTransform="translate(1040 110) rotate(90) scale(330 440)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FBBF24" stop-opacity=".13"/>
      <stop offset="1" stop-color="#FBBF24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="area" x1="0" y1="110" x2="0" y2="282" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FBBF24" stop-opacity=".20"/>
      <stop offset="1" stop-color="#FBBF24" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="line" x1="780" y1="252" x2="1190" y2="114" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A87812"/>
      <stop offset=".5" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#FDE68A"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1280" height="400" rx="24"/></clipPath>
  </defs>

